<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Experience - 3D Career Journey</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* 3D Dark Theme Variables */
            --primary: #4facfe; 
            --secondary: #00f2fe; 
            --accent: #ff0844; 
            --bg-deep: #0f172a; 
            --glass-bg: rgba(255, 255, 255, 0.05); 
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-deep); 
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 70%);
            color: var(--text-main); 
            line-height: 1.6; 
            overflow-x: hidden;
        }
        
        /* 3D Glass Navigation */
        .nav-bar { 
            padding: 20px 5%; 
            border-bottom: 1px solid var(--glass-border); 
            background: rgba(15, 23, 42, 0.8); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .back-button { color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 1.1rem; transition: color 0.3s;}
        .back-button:hover { color: var(--primary); }

        /* Floating Hero Section */
        .hero { 
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.1) 0%, rgba(0, 242, 254, 0.1) 100%); 
            color: var(--text-main); 
            padding: 4rem 2rem; 
            text-align: center; 
            border-bottom: 1px solid var(--glass-border);
            transform-style: preserve-3d;
        }
        
        .hero-content { animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .hero h1 { margin: 0; font-size: 2.8rem; text-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .hero p { font-size: 1.2rem; color: var(--primary); margin-top: 10px; }

        .container { max-width: 900px; margin: 60px auto; padding: 0 20px; perspective: 1000px; }

        /* Glowing Timeline */
        .timeline { border-left: 4px solid rgba(79, 172, 254, 0.3); padding-left: 30px; margin-left: 20px; position: relative; }
        
        /* 3D Glass Job Cards */
        .job-card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 30px; 
            border-radius: 15px; 
            margin-bottom: 40px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            position: relative; 
            transform-style: preserve-3d; 
        }
        
        /* Glowing Dots */
        .job-card::before { 
            content: ''; 
            position: absolute; 
            left: -48px; 
            top: 35px; 
            width: 20px; 
            height: 20px; 
            background: var(--accent); 
            border-radius: 50%; 
            border: 4px solid var(--bg-deep); 
            box-shadow: 0 0 15px var(--accent);
        }

        /* Pop-out Text effect */
        .job-card > * { transform: translateZ(30px); }

        .job-title { color: var(--text-main); font-size: 1.8rem; margin: 0 0 5px 0; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
